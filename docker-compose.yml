version: "3.4"
services:
  postgres:
    image: postgres:16
    container_name: urlshortener-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urlshortenerdb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./UrlShortener.Api
      dockerfile: Dockerfile
    container_name: urlshortener-api-container
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=urlshortenerdb;Username=postgres;Password=password
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
